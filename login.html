<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hasnan Private App</title>
    
    <!-- Konfigurasi PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <!-- Library Eksternal -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Animasi Latar Belakang - Disesuaikan dengan warna Biru Logo */
        @keyframes blob { 
            0% { transform: translate(0px, 0px) scale(1); } 
            33% { transform: translate(30px, -50px) scale(1.1); } 
            66% { transform: translate(-20px, 20px) scale(0.9); } 
            100% { transform: translate(0px, 0px) scale(1); } 
        }
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
        
        /* Animasi Masuk */
        @keyframes fadeInUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-entry { animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
        
        /* Glassmorphism */
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.6); }
    </style>
</head>

<body class="relative min-h-screen bg-slate-50 text-slate-800 flex items-center justify-center p-4 sm:py-12 md:p-8 overflow-x-hidden">

    <!-- Efek Latar Belakang (Warna disesuaikan agar cocok dengan Logo Biru) -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
        <div class="absolute top-1/4 left-1/4 w-72 h-72 md:w-96 md:h-96 lg:w-[30rem] lg:h-[30rem] bg-blue-300/40 rounded-full mix-blend-multiply filter blur-3xl animate-blob"></div>
        <div class="absolute bottom-1/4 right-1/4 w-72 h-72 md:w-96 md:h-96 lg:w-[30rem] lg:h-[30rem] bg-indigo-200/40 rounded-full mix-blend-multiply filter blur-3xl animate-blob animation-delay-2000"></div>
    </div>

    <!-- WADAH LOGIN -->
    <div class="animate-entry w-full max-w-sm md:max-w-md lg:max-w-[420px] glass-card rounded-3xl shadow-2xl shadow-blue-900/10 overflow-hidden relative z-10 transition-all duration-300">
        
        <!-- Bagian Header Login (Bersih, Minimalis, Fokus pada Logo) -->
        <div class="bg-white p-8 md:p-10 text-center border-b border-slate-100 transition-all duration-300">
           <!-- WADAH LOGO GAMBAR -->
            <div class="relative inline-block mb-4 md:mb-5 group">
                <!-- Efek Glow di belakang logo -->
                <div class="absolute -inset-2 bg-blue-500 rounded-[2rem] blur-xl opacity-20 group-hover:opacity-40 transition duration-500"></div>
                
                <!-- Gambar Logo PNG (Menggunakan drop-shadow agar bayangan mengikuti bentuk logo) -->
                <img src="logo_v2.png" alt="Logo App" class="relative w-20 h-20 md:w-24 md:h-24 object-contain drop-shadow-xl transform group-hover:scale-105 transition-all duration-300">
            </div>

        <!-- Form Input -->
        <div class="bg-white/50 p-8 md:p-10 space-y-5 md:space-y-6 transition-all duration-300">
            <div class="space-y-1.5 md:space-y-2">
                <label class="text-[10px] md:text-xs font-bold text-slate-500 uppercase tracking-widest">Email / Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 md:pl-4 text-slate-400">
                        <span class="material-symbols-outlined text-lg md:text-xl">account_circle</span>
                    </span>
                    <input type="text" id="username" placeholder="contoh@gmail.com" class="w-full pl-10 md:pl-12 pr-4 py-3 md:py-3.5 text-sm md:text-base bg-white border border-slate-200 rounded-xl md:rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-semibold text-slate-700 placeholder:text-slate-400 shadow-sm">
                </div>
            </div>

            <div class="space-y-1.5 md:space-y-2">
                <label class="text-[10px] md:text-xs font-bold text-slate-500 uppercase tracking-widest">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 md:pl-4 text-slate-400">
                        <span class="material-symbols-outlined text-lg md:text-xl">lock</span>
                    </span>
                    <input type="password" id="password" placeholder="••••••••" class="w-full pl-10 md:pl-12 pr-4 py-3 md:py-3.5 text-sm md:text-base bg-white border border-slate-200 rounded-xl md:rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-semibold text-slate-700 placeholder:text-slate-400 shadow-sm">
                </div>
            </div>

            <div class="pt-2 md:pt-3">
                <button onclick="login()" class="w-full py-3.5 md:py-4 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm md:text-base rounded-xl md:rounded-2xl shadow-lg shadow-blue-500/30 transition-all duration-300 active:scale-[0.98]">
                    Masuk
                </button>
            </div>

            <!-- TOMBOL BUKA SCANNER LOGIN -->
            <div class="mt-6 md:mt-8 flex flex-col items-center">
                <div class="w-full flex items-center gap-3 mb-4 md:mb-5">
                    <div class="h-px bg-slate-200 flex-grow"></div>
                    <span class="text-xs md:text-sm font-bold text-slate-400 uppercase tracking-widest">Atau</span>
                    <div class="h-px bg-slate-200 flex-grow"></div>
                </div>
                
                <button onclick="bukaLoginQR()" class="w-full flex items-center justify-center gap-2 px-5 py-3.5 md:py-4 bg-white border-2 border-slate-200 hover:border-blue-500 hover:bg-blue-50 text-slate-700 hover:text-blue-700 rounded-xl md:rounded-2xl font-bold text-sm md:text-base transition-all shadow-sm active:scale-95">
                    <span class="material-symbols-outlined text-xl md:text-2xl">qr_code_scanner</span>
                    Login dengan QR Code
                </button>
            </div>

            <div class="pt-4 md:pt-6 text-center">
                <p class="text-[10px] md:text-xs text-slate-400 font-bold uppercase tracking-widest">© 2026 Hasnan Private System Pro</p>
            </div>
        </div>
    </div>

    <!-- AREA KAMERA SCANNER LOGIN (Responsif) -->
    <div id="areaLoginQR" class="hidden fixed inset-0 z-[9999] bg-slate-900/90 backdrop-blur-sm transition-all overflow-y-auto">
        <div class="min-h-full flex items-center justify-center p-4 py-10">
            <div class="bg-white p-6 md:p-10 rounded-3xl w-full max-w-sm md:max-w-md flex flex-col items-center text-center shadow-2xl animate-modal relative">
                
                <!-- Badge Scanner Aktif -->
                <div class="absolute -top-3">
                    <span class="flex items-center gap-2 text-[10px] md:text-xs font-bold text-blue-600 bg-blue-50 px-3 md:px-4 py-1.5 md:py-2 rounded-full border border-blue-100 shadow-sm">
                        <span class="relative flex h-2.5 w-2.5">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-blue-500"></span>
                        </span>
                        SCANNER AKTIF
                    </span>
                </div>

                <div class="w-16 h-16 md:w-20 md:h-20 rounded-3xl bg-blue-50 text-blue-600 flex items-center justify-center mt-3 mb-4 md:mb-5 shadow-inner">
                    <span class="material-symbols-outlined text-3xl md:text-4xl">qr_code_scanner</span>
                </div>
                
                <h3 class="text-xl md:text-2xl font-extrabold text-slate-800 tracking-tight mb-2">Login Instan</h3>
                <p class="text-xs md:text-sm text-slate-400 font-medium mb-6 md:mb-8 leading-relaxed">Posisikan QR Code Anda di tengah layar untuk masuk secara otomatis.</p>
                
                <div class="relative w-full mb-6 md:mb-8 group">
                    <div class="absolute -inset-1 bg-gradient-to-r from-blue-500 to-indigo-500 rounded-3xl blur opacity-25 group-hover:opacity-40 transition duration-700"></div>
                    <div id="loginReader" class="relative w-full rounded-2xl overflow-hidden shadow-sm border-2 border-slate-100 bg-slate-50 z-10"></div>
                </div>
                
                <div class="w-full bg-slate-50 px-4 py-3 md:py-4 rounded-xl border border-slate-200 mb-6 md:mb-8 shadow-sm flex items-center justify-center min-h-[50px]">
                    <div id="statusLoginQR" class="text-sm md:text-base font-bold text-slate-500 flex items-center justify-center gap-2 transition-all">
                        <span class="material-symbols-outlined text-base md:text-lg animate-pulse">flip_camera_ios</span>
                        Menunggu scan...
                    </div>
                </div>
                
                <button onclick="tutupLoginQR()" class="w-full flex items-center justify-center gap-2 px-4 py-3.5 md:py-4 bg-rose-50 text-rose-600 font-bold text-sm md:text-base rounded-xl hover:bg-rose-100 transition active:scale-95 border border-rose-100">
                    <span class="material-symbols-outlined text-lg">close</span> Batalkan
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL PERINGATAN -->
    <div id="modalPeringatan" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] flex items-center justify-center hidden p-4 transition-all duration-300">
        <div class="bg-white w-full max-w-sm md:max-w-md rounded-3xl p-6 md:p-8 flex flex-col items-center text-center shadow-2xl anim-fade-up">
            <div class="w-16 h-16 md:w-20 md:h-20 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mb-4 md:mb-5 shadow-inner">
                <span class="material-symbols-outlined text-4xl md:text-5xl">info</span>
            </div>
            
            <h4 class="text-lg md:text-xl font-extrabold text-slate-800 mb-2">Informasi</h4>
            <p id="teksPeringatan" class="text-sm md:text-base text-slate-500 font-medium mb-6 md:mb-8">Pesan peringatan akan muncul di sini.</p>
            
            <button onclick="tutupPeringatan()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm md:text-base py-3 md:py-4 rounded-xl md:rounded-2xl transition-all active:scale-95">
                Mengerti
            </button>
        </div>
    </div>

    <!-- Script Koneksi -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="login.js"></script>

    <!-- Registrasi Service Worker PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('PWA Siap! Service Worker aktif.');
                }).catch(err => console.error('PWA Gagal:', err));
            });
        }
    </script>
</body>
</html>
