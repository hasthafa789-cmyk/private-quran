<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murid Bimbingan Saya</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <script>
        const roleAkses = localStorage.getItem("role");
        if (roleAkses !== "admin" && roleAkses !== "guru") {
            window.location.replace("index.html");
        }
    </script>

    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-teal-600 text-4xl">local_library</span>
                <div>
                    <h1 class="text-2xl font-bold text-slate-800">Murid Bimbingan Saya</h1>
                    <p class="text-sm text-slate-500">Daftar santri dan progres yang berada di bawah bimbingan Anda</p>
                </div>
            </div>
            <a href="index.html" class="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium rounded-xl transition-all shadow-sm">
                <span class="material-symbols-outlined text-sm">arrow_back</span> Kembali
            </a>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-max">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-100 text-slate-600 text-sm">
                            <th class="py-4 px-4 font-semibold w-12 text-center">No</th>
                            <th class="py-4 px-4 font-semibold">Nama Santri</th>
                            <th class="py-4 px-4 font-semibold">Email</th>
                            <th class="py-4 px-4 font-semibold">Terakhir Hafalan</th>
                            <th class="py-4 px-4 font-semibold">Terakhir Hijaiyah</th>
                            <th class="py-4 px-4 font-semibold">Terakhir Tajwid</th>
                            <th class="py-4 px-4 font-semibold">Metode Ummi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelBodyBimbingan" class="text-sm">
                        <tr>
                            <td colspan="7" class="py-8 text-center text-slate-500">
                                <span class="material-symbols-outlined animate-spin text-2xl mb-2">autorenew</span>
                                <p>Sedang memuat data murid dan progres...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script src="js/data.js"></script>
    <script src="js/progres-parser.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCIBGqJVfrRZikYeQDtQynWDxybsFFtY-0",
            authDomain: "hasnanprivate.firebaseapp.com",
            projectId: "hasnanprivate",
            storageBucket: "hasnanprivate.firebasestorage.app",
            messagingSenderId: "737022132780",
            appId: "1:737022132780:web:8ab47b587f13ee53900789"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ==================== CORE FIREBASE SYSTEM ====================
        async function muatMuridBimbingan() {
            const tabelBody = document.getElementById("tabelBodyBimbingan");
            const namaGuruLogin = localStorage.getItem("nama"); 

            if (!namaGuruLogin) {
                tabelBody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-red-500">Gagal memuat. Silakan login ulang.</td></tr>`;
                return;
            }

            try {
                const userSnapshot = await db.collection("users")
                                             .where("guruPembimbing", "==", namaGuruLogin)
                                             .get();

                if (userSnapshot.empty) {
                    tabelBody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-500">Anda belum memiliki murid bimbingan.</td></tr>`;
                    return;
                }

                const dataPromises = userSnapshot.docs.map(async (userDoc) => {
                    const userData = userDoc.data();
                    const nama = userData.nama;

                    const progressDoc = await db.collection("database_hafalan").doc(nama).get();
                    const progressData = progressDoc.exists ? progressDoc.data() : {};

                    return {
                        ...userData,
                        terakhirHafalan: parseHafalan(progressData.terakhirHafalan || "-", progressData),
                        terakhirHijaiyah: parseHijaiyah(progressData.terakhirHijaiyah || "-"),
                        terakhirTajwid: parseTajwid(progressData.terakhirTajwid || "-"),
                        ummi: ringkasDataUmmi(progressData.ummi) 
                    };
                });

                const dataArray = await Promise.all(dataPromises);

                dataArray.sort((a, b) => (a.nama || "").localeCompare(b.nama || ""));

                tabelBody.innerHTML = dataArray.map((data, index) => `
                    <tr class="border-b border-slate-100 hover:bg-slate-50/50 transition-colors">
                        <td class="py-3 px-4 text-center text-slate-500 font-medium">${index + 1}</td>
                        <td class="py-3 px-4 font-bold text-teal-700">${esc(data.nama || "-")}</td>
                        <td class="py-3 px-4 text-slate-500 font-mono text-xs">${esc(data.email || "-")}</td>
                        <td class="py-3 px-4 text-slate-700 font-medium">${esc(data.terakhirHafalan)}</td>
                        <td class="py-3 px-4 text-slate-600">${esc(data.terakhirHijaiyah)}</td>
                        <td class="py-3 px-4 text-slate-600 font-medium text-emerald-700">${esc(data.terakhirTajwid)}</td>
                        <td class="py-3 px-4 text-slate-700 font-semibold">${esc(data.ummi)}</td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error("Gagal memuat:", error);
                tabelBody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-red-500">Gagal mengambil data. ${esc(error.message)}</td></tr>`;
            }
        }

        auth.onAuthStateChanged((user) => {
            if (user) muatMuridBimbingan();
        });
    </script>
</body>
</html>
